<!doctype html>
<html lang="en" data-role="desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yearbook Help — Staff Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@400;500;600&family=Manrope:wght@300;400&display=swap">
  <link rel="stylesheet" href="../styles.css?v=5">
</head>
<body class="desk">
  <header class="mast">
    <div>
      <p class="kicker">Black Pine Circle School · Staff desk</p>
      <h1>Yearbook Order Help</h1>
    </div>
    <div class="mast-tools">
      <span id="syncPill" class="pill" hidden></span>
      <button id="newBtn" class="primary" type="button">New ticket</button>
      <button id="settingsBtn" type="button">Settings</button>
      <button id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>

  <p id="banner" class="banner" hidden></p>

  <main id="gate" class="gate" hidden><form id="gateForm" novalidate></form></main>

  <div class="bench">
    <section class="queue" aria-label="Tickets">
      <div id="tabs" class="tabs" role="tablist"></div>
      <input id="search" type="search" placeholder="Search name, code or details" aria-label="Search tickets">
      <ul id="list" class="list"></ul>
    </section>
    <section id="detail" class="detail" aria-live="polite"></section>
  </div>

  <dialog id="newDlg"><form id="newForm" method="dialog"></form></dialog>
  <dialog id="settingsDlg"><form id="settingsForm" method="dialog"></form></dialog>

  <script src="../js/config.js?v=5"></script>
  <script src="../js/util.js?v=5"></script>
  <script src="../js/store.js?v=5"></script>
  <script src="../js/sync.js?v=5"></script>
  <script src="../js/accounts.js?v=5"></script>
  <script src="../js/desk.js?v=5"></script>
</body>
</html>
